<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MONEYTI - 고등학생 경제 성향 테스트</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f4f7fb;
      color: #172033;
    }

    .container {
      width: min(92%, 720px);
      margin: auto;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 0;
    }

    .card {
      width: 100%;
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      color: #173d77;
      font-size: 40px;
    }

    h2 {
      font-size: 25px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    h3 {
      margin-top: 32px;
      color: #173d77;
    }

    p {
      line-height: 1.7;
    }

    .subtitle {
      color: #69758a;
      font-size: 17px;
    }

    .start-icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .intro-box {
      background: #f6f8fc;
      padding: 18px;
      border-radius: 15px;
      margin: 25px 0;
      font-size: 14px;
      line-height: 1.7;
    }

    button {
      width: 100%;
      border: none;
      padding: 17px 20px;
      margin-top: 12px;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .main-button {
      background: #173d77;
      color: white;
      font-weight: 700;
    }

    .main-button:hover {
      background: #102f60;
      transform: translateY(-2px);
    }

    .answer-button {
      background: #f2f5f9;
      color: #243044;
      text-align: left;
      border: 2px solid transparent;
    }

    .answer-button:hover {
      background: #e4ebf5;
    }

    .answer-button.selected {
      background: #e4edfb;
      border-color: #3478d4;
      color: #173d77;
      font-weight: 700;
    }

    .back-button {
      background: white;
      color: #66758b;
      border: 1px solid #dbe2ec;
      margin-top: 22px;
    }

    .back-button:hover {
      background: #f5f7fa;
    }

    .progress-area {
      margin-bottom: 30px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
    }

    .progress-text {
      font-size: 14px;
      color: #788396;
    }

    .progress-percent {
      font-size: 14px;
      color: #3478d4;
      font-weight: 700;
    }

    .progress-bar {
      width: 100%;
      height: 9px;
      background: #e8edf5;
      border-radius: 30px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      background: #3478d4;
      transition: width .25s;
    }

    .category {
      display: inline-block;
      padding: 7px 12px;
      margin-bottom: 12px;
      border-radius: 20px;
      background: #edf3fc;
      color: #3478d4;
      font-size: 13px;
      font-weight: 700;
    }

    .result-type {
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #173d77, #3b7cd4);
      padding: 30px 20px;
      border-radius: 22px;
      margin-bottom: 25px;
    }

    .result-label {
      opacity: .85;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .result-code {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .result-name {
      font-size: 23px;
      font-weight: 700;
      margin-top: 7px;
    }

    .trait {
      margin: 23px 0;
    }

    .trait-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .trait-bar {
      width: 100%;
      height: 12px;
      background: #e6ebf2;
      border-radius: 20px;
      overflow: hidden;
    }

    .trait-fill {
      height: 100%;
      background: #3478d4;
      border-radius: 20px;
      transition: width .35s ease;
    }

    .trait-result {
      margin-top: 6px;
      text-align: right;
      font-size: 13px;
      color: #6e7888;
    }

    .info-box {
      background: #f7f9fc;
      border-radius: 16px;
      padding: 20px;
      margin-top: 14px;
      line-height: 1.75;
    }

    .info-box strong {
      display: block;
      margin-bottom: 8px;
      color: #173d77;
      font-size: 17px;
    }

    .investment-card {
      background: #f7f9fc;
      border-radius: 18px;
      padding: 22px;
      margin-top: 15px;
      line-height: 1.75;
    }

    .investment-card h4 {
      margin: 0 0 12px 0;
      color: #173d77;
      font-size: 20px;
    }

    .asset-tags {
      margin-bottom: 15px;
    }

    .asset-tag {
      display: inline-block;
      background: #eaf2ff;
      color: #245fa8;
      padding: 6px 11px;
      border-radius: 20px;
      margin: 3px;
      font-size: 13px;
      font-weight: 700;
    }

    .asset-box {
      margin-top: 14px;
      padding: 17px;
      background: white;
      border-radius: 12px;
      border: 1px solid #e5eaf1;
      line-height: 1.7;
    }

    .asset-box b {
      color: #173d77;
    }

    .strategy-box {
      margin-top: 18px;
      padding: 17px;
      background: #edf4ff;
      border-radius: 13px;
      color: #183b67;
      line-height: 1.7;
    }

    .notice {
      background: #fff9e8;
      color: #66582f;
      padding: 16px;
      border-radius: 13px;
      margin-top: 25px;
      font-size: 13px;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }

    @media(max-width: 600px) {
      .card {
        padding: 28px 20px;
      }

      h1 {
        font-size: 32px;
      }

      h2 {
        font-size: 21px;
      }

      .result-code {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- 시작 화면 -->
  <div class="card" id="startScreen">

    <div class="start-icon">
      💰
    </div>

    <h1>
      MONEYTI
    </h1>

    <p class="subtitle">
      18개의 질문으로 알아보는<br>
      고등학생 경제 성향 테스트
    </p>

    <div class="intro-box">
      돈을 사용하는 방식, 저축 습관, 위험에 대한 태도,
      경제적 판단 방식을 분석하여
      <b>나의 경제 성향과 어울리는 투자 방식을 알아볼 수 있습니다.</b>
    </div>

    <button
      class="main-button"
      onclick="startTest()"
    >
      테스트 시작하기
    </button>

  </div>


  <!-- 질문 화면 -->
  <div
    class="card hidden"
    id="questionScreen"
  >

    <div class="progress-area">

      <div class="progress-top">

        <span
          class="progress-text"
          id="progressText"
        ></span>

        <span
          class="progress-percent"
          id="progressPercent"
        ></span>

      </div>

      <div class="progress-bar">

        <div
          class="progress"
          id="progress"
        ></div>

      </div>

    </div>

    <div
      class="category"
      id="category"
    ></div>

    <h2 id="question"></h2>

    <div id="answers"></div>

    <button
      class="back-button"
      id="backButton"
      onclick="previousQuestion()"
    >
      ← 이전 질문
    </button>

  </div>


  <!-- 결과 화면 -->
  <div
    class="card hidden"
    id="resultScreen"
  >

    <div class="result-type">

      <div class="result-label">
        나의 경제 유형
      </div>

      <div
        class="result-code"
        id="resultCode"
      ></div>

      <div
        class="result-name"
        id="resultName"
      ></div>

    </div>

    <p id="resultSummary"></p>

    <h3>
      📊 나의 경제 성향
    </h3>

    <div id="traitGraphs"></div>

    <div class="info-box">

      <strong>
        💎 장점
      </strong>

      <span id="strength"></span>

    </div>

    <div class="info-box">

      <strong>
        ⚠️ 단점 및 주의할 점
      </strong>

      <span id="weakness"></span>

    </div>

    <h3>
      📈 나에게 맞는 투자 방식
    </h3>

    <div
      class="investment-card"
      id="investmentDetail"
    ></div>

    <div class="notice">

      MONEYTI는 경제·금융 교육을 위해 제작된 성향 테스트입니다.
      결과는 실제 투자 적합성 진단이나 특정 금융상품에 대한 투자 권유가 아닙니다.

    </div>

    <button
      class="main-button"
      onclick="restartTest()"
    >
      다시 테스트하기
    </button>

  </div>

</div>


<script>

/* ============================================================
   18개 질문
============================================================ */

/* ============================================================
   테스트 상태
============================================================ */

let currentQuestion = 0;

let userAnswers =
  new Array(questions.length).fill(null);


/* ============================================================
   테스트 시작
============================================================ */

function startTest() {

  document
    .getElementById("startScreen")
    .classList.add("hidden");

  document
    .getElementById("questionScreen")
    .classList.remove("hidden");

  showQuestion();
}


/* ============================================================
   질문 표시
============================================================ */

function showQuestion() {

  const q =
    questions[currentQuestion];

  const progress =
    Math.round(
      ((currentQuestion + 1) / questions.length) * 100
    );

  document
    .getElementById("progressText")
    .innerText =
    `${currentQuestion + 1} / ${questions.length}`;

  document
    .getElementById("progressPercent")
    .innerText =
    `${progress}%`;

  document
    .getElementById("progress")
    .style.width =
    `${progress}%`;

  document
    .getElementById("category")
    .innerText =
    q.category;

  document
    .getElementById("question")
    .innerText =
    q.text;

  const answersDiv =
    document.getElementById("answers");

  answersDiv.innerHTML = "";

  q.answers.forEach((answer, index) => {

    const button =
      document.createElement("button");

    button.className =
      "answer-button";

    if (
      userAnswers[currentQuestion]
      === index
    ) {
      button.classList.add("selected");
    }

    button.innerText =
      answer[0];

    button.onclick =
      () => selectAnswer(index);

    answersDiv.appendChild(button);

  });

  const backButton =
    document.getElementById("backButton");

  backButton.style.display =
    currentQuestion === 0
      ? "none"
      : "block";
}


/* ============================================================
   답 선택
============================================================ */

function selectAnswer(answerIndex) {

  userAnswers[currentQuestion] =
    answerIndex;

  if (
    currentQuestion
    < questions.length - 1
  ) {

    currentQuestion++;

    showQuestion();

  } else {

    showResult();

  }
}


/* ============================================================
   이전 질문
============================================================ */

function previousQuestion() {

  if (currentQuestion > 0) {

    currentQuestion--;

    showQuestion();

  }
}


/* ============================================================
   점수 계산
============================================================ */

function calculateScores() {

  const scores = {
    ID: 0,
    SC: 0,
    AT: 0,
    PF: 0
  };

  questions.forEach(
    (question, index) => {

      const selected =
        userAnswers[index];

      if (selected !== null) {

        const value =
          question.answers[selected][1];

        scores[question.axis] +=
          value;

      }

    }
  );

  return scores;
}


/* ============================================================
   경제 유형 생성
============================================================ */

function makeType(scores) {

  let type = "";

  type +=
    scores.ID >= 0 ? "D" : "I";

  type +=
    scores.SC >= 0 ? "S" : "C";

  type +=
    scores.AT >= 0 ? "T" : "A";

  type +=
    scores.PF >= 0 ? "P" : "F";

  return type;
}

/* ============================================================
   경제 성향 그래프
   표시 퍼센트와 파란색 바 길이를 동일하게 설정
============================================================ */

function createGraphs(scores) {

  const area =
    document.getElementById(
      "traitGraphs"
    );

  area.innerHTML = "";


  const graphs = [

    {
      axis: "ID",
      left: "즉흥 소비",
      right: "계획 소비"
    },

    {
      axis: "SC",
      left: "소비 중심",
      right: "저축 중심"
    },

    {
      axis: "AT",
      left: "도전형",
      right: "안정형"
    },

    {
      axis: "PF",
      left: "직관형",
      right: "분석형"
    }

  ];


  graphs.forEach(graph => {

    /*
      해당 축의 질문 수를 계산
    */

    const questionCount =
      questions.filter(
        q => q.axis === graph.axis
      ).length;


    /*
      해당 축에서 얻을 수 있는 최대 점수
    */

    const maximumScore =
      questionCount * 2;


    const score =
      scores[graph.axis];


    /*
      원래 점수를 0~100으로 변환

      0%   = 완전 왼쪽 성향
      50%  = 중립
      100% = 완전 오른쪽 성향
    */

    let rightPercent =
      Math.round(
        (
          (score + maximumScore)
          /
          (maximumScore * 2)
        )
        * 100
      );


    rightPercent =
      Math.max(
        0,
        Math.min(
          100,
          rightPercent
        )
      );


    /*
      우세한 성향과 실제 퍼센트 계산

      예:
      오른쪽 점수가 25%라면
      왼쪽 성향은 75%

      오른쪽 점수가 65%라면
      오른쪽 성향은 65%
    */

    let dominantName;
    let dominantPercent;


    if (
      rightPercent >= 50
    ) {

      dominantName =
        graph.right;

      dominantPercent =
        rightPercent;

    }

    else {

      dominantName =
        graph.left;

      dominantPercent =
        100 - rightPercent;

    }


    /*
      ★ 핵심 수정 부분

      화면에 표시되는 퍼센트와
      파란 막대의 width를
      완전히 같은 값으로 사용
    */

    const barPercent =
      dominantPercent;


    const div =
      document.createElement(
        "div"
      );


    div.className =
      "trait";


    div.innerHTML = `

      <div class="trait-head">

        <span>
          ${graph.left}
        </span>

        <span>
          ${graph.right}
        </span>

      </div>


      <div class="trait-bar">

        <div
          class="trait-fill"
          style="width:${barPercent}%"
        ></div>

      </div>


      <div class="trait-result">

        ${dominantName} ${dominantPercent}%

      </div>

    `;


    area.appendChild(
      div
    );

  });

}

function restartTest() {

  currentQuestion = 0;

  userAnswers =
    new Array(
      questions.length
    ).fill(null);

  document
    .getElementById("resultScreen")
    .classList.add("hidden");

  document
    .getElementById("startScreen")
    .classList.remove("hidden");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

</script>
