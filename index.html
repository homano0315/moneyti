<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {

    }

    body {
      margin: 0;
      font-family:

        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f4f7fb;
      color: #172033;
    }

    .container {
      width: min(92%, 680px);
      margin: auto;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 0;
    }

    .card {
      width: 100%;
      background: white;

      padding: 40px;

      border-radius: 24px;

      box-shadow:
        0 12px 40px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      color: #173d77;
      font-size: 40px;
    }

    h2 {
      font-size: 25px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    h3 {
      margin-top: 32px;
      color: #173d77;
    }

    p {
      line-height: 1.7;
    }

    .subtitle {
      color: #69758a;
      font-size: 17px;
    }

    .start-icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .intro-box {
      background: #f6f8fc;

      padding: 18px;

      border-radius: 15px;

      margin: 25px 0;

      font-size: 14px;
      line-height: 1.7;
    }

    button {
      width: 100%;
      border: none;

      padding: 17px 20px;

      margin-top: 12px;

      border-radius: 14px;

      font-size: 16px;

      cursor: pointer;

      transition: 0.2s;
    }

    .main-button {
      background: #173d77;
      color: white;
      font-weight: 700;
    }

    .main-button:hover {
      background: #102f60;
      transform: translateY(-2px);
    }

    .answer-button {
      background: #f2f5f9;
      color: #243044;

      text-align: left;

      border: 2px solid transparent;
    }

    .answer-button:hover {
      background: #e4ebf5;
    }

    .answer-button.selected {
      background: #e4edfb;
      border-color: #3478d4;
      color: #173d77;
      font-weight: 700;
    }

    .back-button {
      background: white;
      color: #66758b;

      border: 1px solid #dbe2ec;

      margin-top: 22px;
    }

    .back-button:hover {
      background: #f5f7fa;
    }

    .progress-area {
      margin-bottom: 30px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 9px;
    }

    .progress-text {
      font-size: 14px;
      color: #788396;
    }

    .progress-percent {
      font-size: 14px;
      color: #3478d4;
      font-weight: 700;
    }

    .progress-bar {
      width: 100%;
      height: 9px;

      background: #e8edf5;

      border-radius: 30px;

      overflow: hidden;
    }

    .progress {
      height: 100%;
      background: #3478d4;

      transition: width .25s;
    }

    .category {
      display: inline-block;

      padding: 7px 12px;
      margin-bottom: 12px;

      border-radius: 20px;

      background: #edf3fc;
      color: #3478d4;

      font-size: 13px;
      font-weight: 700;
    }

    .result-type {
      text-align: center;

      color: white;

      background:
        linear-gradient(
          135deg,
          #173d77,
          #3b7cd4
        );

      padding: 30px 20px;

      border-radius: 22px;

      margin-bottom: 25px;
    }

    .result-label {
      opacity: .85;

      font-size: 14px;

      margin-bottom: 5px;
    }

    .result-code {
      font-size: 44px;

      font-weight: 800;

      letter-spacing: 4px;
    }

    .result-name {
      font-size: 23px;

      font-weight: 700;

      margin-top: 7px;
    }

    .trait {
      margin: 23px 0;
    }

    .trait-head {
      display: flex;
      justify-content: space-between;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 600;
    }

    .trait-bar {
      width: 100%;

      height: 12px;

      background: #e6ebf2;

      border-radius: 20px;

      overflow: hidden;
    }

    .trait-fill {
      height: 100%;

      background: #3478d4;

      border-radius: 20px;
    }

    .trait-result {
      margin-top: 6px;

      text-align: right;

      font-size: 13px;

      color: #6e7888;
    }

    .info-box {
      background: #f7f9fc;

      border-radius: 16px;

      padding: 20px;

      margin-top: 14px;

      line-height: 1.7;
    }

    .info-box strong {
      display: block;

      margin-bottom: 8px;

      color: #173d77;

      font-size: 17px;
    }

    .notice {
      background: #fff9e8;

      color: #66582f;

      padding: 16px;

      border-radius: 13px;

      margin-top: 25px;

      font-size: 13px;

      line-height: 1.6;
    }

    .hidden {
      display: none;
    }

    @media(max-width: 600px) {

      .card {
        padding: 28px 20px;
      }

      h1 {
        font-size: 32px;
      }

      h2 {
        font-size: 21px;
      }

      .result-code {
        font-size: 38px;
      }

    }
  </style>
</head>


<body>

<div class="container">


  <!-- 시작 화면 -->
  <div class="card" id="startScreen">

    <div class="start-icon">💰</div>

    <h1>MONEYTI</h1>

    <p class="subtitle">
      18개의 질문으로 알아보는<br>
      고등학생 경제 성향 테스트
    </p>

    <div class="intro-box">
      돈을 쓰는 방식, 저축 습관, 위험에 대한 태도,
      경제적 판단 방식을 바탕으로
      나의 경제 성향을 알아볼 수 있습니다.
    </div>

    <button
      class="main-button"
      onclick="startTest()"
    >
      테스트 시작하기
    </button>

  </div>



  <!-- 질문 화면 -->
  <div
    class="card hidden"
    id="questionScreen"
  >

    <div class="progress-area">

      <div class="progress-top">

        <span
          class="progress-text"
          id="progressText"
        ></span>

        <span
          class="progress-percent"
          id="progressPercent"
        ></span>

      </div>

      <div class="progress-bar">

        <div
          class="progress"
          id="progress"
        ></div>

      </div>

    </div>


    <div
      class="category"
      id="category"
    ></div>

    <h2 id="question"></h2>

    <div id="answers"></div>


    <button
      class="back-button"
      id="backButton"
      onclick="previousQuestion()"
    >
      ← 이전 질문
    </button>

  </div>



  <!-- 결과 화면 -->
  <div
    class="card hidden"
    id="resultScreen"
  >

    <div class="result-type">

      <div class="result-label">
        나의 경제 유형
      </div>

      <div
        class="result-code"
        id="resultCode"
      ></div>

      <div
        class="result-name"
        id="resultName"
      ></div>

    </div>


    <p id="resultSummary"></p>


    <h3>📊 나의 경제 성향</h3>

    <div id="traitGraphs"></div>


    <div class="info-box">

      <strong>
        💎 장점
      </strong>

      <span id="strength"></span>

    </div>


    <div class="info-box">

      <strong>
        ⚠️ 단점 및 주의할 점
      </strong>

      <span id="weakness"></span>

    </div>


    <div class="info-box">

      <strong>
        🔧 보완점
      </strong>

      <span id="improvement"></span>

    </div>


    <div class="info-box">

      <strong>
        💰 추천 경제 습관
      </strong>

      <span id="habit"></span>

    </div>


    <div class="info-box">

      <strong>
        📈 투자 성향
      </strong>

      <span id="investment"></span>

    </div>


    <div class="notice">
      MONEYTI는 경제·금융 교육을 위해 제작된
      간단한 성향 테스트입니다.
      실제 투자 적합성 진단이나 특정 금융상품의
      투자 권유를 목적으로 하지 않습니다.
    </div>


    <button
      class="main-button"
      onclick="restartTest()"
    >
      다시 테스트하기
    </button>

  </div>

</div>

        "수익이 높다고 하면 관심이 생긴다.",
        -1
      ],

      [
        "기본적인 정보를 찾아본다.",
        1
      ],

      [
        "수익뿐 아니라 위험, 구조, 수수료까지 알아본다.",
        2
      ]

    ]
  },


  {
    category: "경제 판단",

    text:
      "큰 돈을 사용하거나 중요한 경제적 결정을 해야 할 때 나는?",

    axis: "PF",

    answers: [

      [
        "내 느낌을 믿고 빠르게 결정한다.",
        -2
      ],

      [
        "주변 사람의 의견을 참고해 결정한다.",
        -1
      ],

      [
        "여러 정보를 찾아보고 결정한다.",
        1
      ],

      [
        "여러 선택지를 비교하고 장단점을 분석한 뒤 결정한다.",
        2
      ]

    ]
  }

];



let currentQuestion = 0;


/*
각 문항별로 사용자가 선택한 답을 저장합니다.

예:
userAnswers[0] = 2

아직 답하지 않았다면 null
*/

let userAnswers =
  new Array(questions.length).fill(null);



function startTest() {

  document
    .getElementById("startScreen")
    .classList
    .add("hidden");


  document
    .getElementById("questionScreen")
    .classList
    .remove("hidden");


  showQuestion();

}



function showQuestion() {

  const q =
    questions[currentQuestion];


  const progress =
    Math.round(
      ((currentQuestion + 1) /
      questions.length) * 100
    );


  document
    .getElementById("progressText")
    .innerText =
    `${currentQuestion + 1} / ${questions.length}`;


  document
    .getElementById("progressPercent")
    .innerText =
    `${progress}%`;


  document
    .getElementById("progress")
    .style
    .width =
    `${progress}%`;


  document
    .getElementById("category")
    .innerText =
    q.category;


  document
    .getElementById("question")
    .innerText =
    q.text;


  const answersDiv =
    document.getElementById("answers");


  answersDiv.innerHTML = "";


  q.answers.forEach((answer, index) => {

    const button =
      document.createElement("button");


    button.className =
      "answer-button";


    /*
    이전에 선택했던 답이라면
    선택 표시를 유지
    */

    if (
      userAnswers[currentQuestion]
      === index
    ) {

      button.classList.add("selected");

    }


    button.innerText =
      answer[0];


    button.onclick =
      () => selectAnswer(index);


    answersDiv.appendChild(button);

  });


  /*
  첫 번째 질문에서는
  이전 질문 버튼 숨김
  */

  const backButton =
    document.getElementById("backButton");


  if (currentQuestion === 0) {

    backButton.style.display =
      "none";

  } else {

    backButton.style.display =
      "block";

  }

}



function selectAnswer(answerIndex) {

  /*
  현재 문제의 답을 저장
  */

  userAnswers[currentQuestion] =
    answerIndex;


  /*
  마지막 문제인지 확인
  */

  if (
    currentQuestion
    < questions.length - 1
  ) {

    currentQuestion++;

    showQuestion();

  } else {

    showResult();

  }

}



function previousQuestion() {

  if (currentQuestion > 0) {

    currentQuestion--;

    showQuestion();

  }

}



/*
사용자가 선택한 답 전체를 기준으로
점수를 매번 새로 계산합니다.

따라서 이전 답을 수정하더라도
점수가 중복으로 더해지지 않습니다.
*/

function calculateScores() {

  const scores = {

    ID: 0,
    SC: 0,
    AT: 0,
    PF: 0

  };


  questions.forEach(
    (question, index) => {

      const selected =
        userAnswers[index];


      if (selected !== null) {

        const value =
          question.answers[selected][1];


        scores[question.axis] +=
          value;

      }

    }
  );


  return scores;

}



function makeType(scores) {

  let type = "";


  /*
  ID

  +점수 = 계획형 D
  -점수 = 즉흥형 I
  */

  type +=
    scores.ID >= 0
    ? "D"
    : "I";


  /*
  SC

  +점수 = 저축형 S
  -점수 = 소비형 C
  */

  type +=
    scores.SC >= 0
    ? "S"
    : "C";


  /*
  AT

  +점수 = 안정형 T
  -점수 = 도전형 A
  */

  type +=
    scores.AT >= 0
    ? "T"
    : "A";


  /*
  PF

  +점수 = 분석형 P
  -점수 = 직관형 F
  */

  type +=
    scores.PF >= 0
    ? "P"
    : "F";


  return type;

}



const typeNames = {

  ISAF:
    "자유로운 도전자",

  ISAP:
    "분석하는 도전자",

  ISTF:
    "안전 중심 실속형",

  ISTP:
    "현실적인 관리형",


  ICAF:
    "자유로운 소비형",

  ICAP:
    "전략적 소비형",

  ICTF:
    "감성적 소비형",

  ICTP:
    "신중한 현실형",


  DSAF:
    "미래형 도전자",

  DSAP:
    "전략적 성장형",

  DSTF:
    "안전 저축형",

  DSTP:
    "계획형 자산관리자",


  DCAF:
    "계획적 경험형",

  DCAP:
    "목표 소비형",

  DCTF:
    "안정적 생활형",

  DCTP:
    "균형 경제형"

};



function showResult() {

  const scores =
    calculateScores();


  const type =
    makeType(scores);


  document
    .getElementById("questionScreen")
    .classList
    .add("hidden");


  document
    .getElementById("resultScreen")
    .classList
    .remove("hidden");


  document
    .getElementById("resultCode")
    .innerText =
    type;


  document
    .getElementById("resultName")
    .innerText =
    typeNames[type];


  const planned =
    type[0] === "D";


  const saving =
    type[1] === "S";


  const stable =
    type[2] === "T";


  const analytical =
    type[3] === "P";



  /*
  한 줄 성향 설명
  */

  document
    .getElementById("resultSummary")
    .innerText =

    `당신은 ${
      planned
      ? "돈을 비교적 계획적으로 사용하는"
      : "상황에 따라 자유롭게 사용하는"
    } 편이며, ${
      saving
      ? "현재 소비보다 미래를 위한 저축을 중요하게 생각하는"
      : "저축보다 현재의 소비와 경험을 중요하게 생각하는"
    } 성향이 있습니다. ${
      stable
      ? "경제적 선택에서는 안정성을 중요하게 생각하며"
      : "경제적 선택에서는 새로운 기회와 높은 수익 가능성에 관심이 많으며"
    }, ${
      analytical
      ? "정보를 비교하고 분석한 뒤 판단하는 편입니다."
      : "직관과 주변 상황의 영향을 받아 판단하는 편입니다."
    }`;



  /*
  장점
  */

  let strengths = [];


  if (planned) {

    strengths.push(
      "돈을 사용할 때 계획을 세우는 능력이 좋습니다."
    );

  } else {

    strengths.push(
      "현재의 필요와 경험에 빠르게 반응할 수 있는 유연성이 있습니다."
    );

  }


  if (saving) {

    strengths.push(
      "미래의 목표를 위해 돈을 모으는 습관을 만들기 쉽습니다."
    );

  } else {

    strengths.push(
      "돈을 단순히 모으기보다 현재의 만족과 경험에도 가치를 두는 편입니다."
    );

  }


  if (stable) {

    strengths.push(
      "위험한 선택을 하기 전에 손실 가능성을 생각하는 편입니다."
    );

  } else {

    strengths.push(
      "새로운 경제적 기회를 적극적으로 탐색할 수 있습니다."
    );

  }


  if (analytical) {

    strengths.push(
      "정보를 확인하고 여러 선택지를 비교하려는 습관이 있습니다."
    );

  } else {

    strengths.push(
      "상황을 빠르게 판단하고 결정을 내리는 편입니다."
    );

  }


  document
    .getElementById("strength")
    .innerText =
    strengths.join(" ");



  /*
  단점
  */

  let weaknesses = [];


  if (!planned) {

    weaknesses.push(
      "계획 없이 소비하다 보면 예상보다 돈을 빠르게 사용할 수 있습니다."
    );

  } else {

    weaknesses.push(
      "계획을 지나치게 중요하게 생각하면 필요한 소비까지 망설일 수 있습니다."
    );

  }


  if (!saving) {

    weaknesses.push(
      "현재의 소비를 우선하면 미래에 필요한 돈을 충분히 준비하지 못할 수 있습니다."
    );

  }


  if (!stable) {

    weaknesses.push(
      "높은 수익 가능성에 집중하면 손실 위험을 낮게 평가할 수 있습니다."
    );

  }


  if (!analytical) {

    weaknesses.push(
      "유행, 광고, 친구의 의견 등에 경제적 판단이 영향을 받을 수 있습니다."
    );

  }


  document
    .getElementById("weakness")
    .innerText =
    weaknesses.join(" ");



  /*
  보완점
  */

  let improvements = [];


  if (!planned) {

    improvements.push(
      "돈을 받으면 먼저 필요한 소비와 자유 소비를 나누는 연습을 해보세요."
    );

  }


  if (!saving) {

    improvements.push(
      "남는 돈을 저축하기보다 처음부터 일정 부분을 따로 보관하는 습관을 만들어보세요."
    );

  }


  if (!stable) {

    improvements.push(
      "높은 수익 가능성을 볼 때 반드시 손실 가능성도 함께 확인해보세요."
    );

  }


  if (!analytical) {

    improvements.push(
      "중요한 소비나 금융 결정 전에는 최소 두 가지 이상의 정보를 비교해보세요."
    );

  }


  if (improvements.length === 0) {

    improvements.push(
      "현재의 안정적인 경제 습관을 유지하면서 새로운 금융 지식도 함께 공부해보세요."
    );

  }


  document
    .getElementById("improvement")
    .innerText =
    improvements.join(" ");



  /*
  추천 경제 습관
  */

  let habitText = "";


  if (!planned && !saving) {

    habitText =
      "돈이 생겼을 때 바로 사용하기보다 소비할 돈, 저축할 돈, 자유롭게 사용할 돈을 먼저 나누어보세요. 작은 돈이라도 꾸준히 기록하면 자신의 소비 패턴을 확인하는 데 도움이 됩니다.";

  }

  else if (planned && saving) {

    habitText =
      "현재처럼 계획과 저축 습관을 유지하되 지나친 절약만 목표로 삼지는 마세요. 저축의 목적을 정하고 필요한 경험이나 자기계발에도 계획적으로 돈을 사용하는 것이 좋습니다.";

  }

  else if (saving) {

    habitText =
      "저축하려는 태도는 좋지만 소비 계획도 함께 세워보세요. 돈을 받는 순간부터 저축할 부분과 사용할 부분을 따로 나누어 관리하면 더 안정적인 습관을 만들 수 있습니다.";

  }

  else {

    habitText =
      "사용할 돈을 미리 나누어 관리하고 작은 돈이라도 일정하게 모아보세요. 한 달 동안 지출한 내용을 기록하고 가장 많이 소비한 분야를 확인하는 것도 도움이 됩니다.";

  }


  document
    .getElementById("habit")
    .innerText =
    habitText;



  /*
  투자 성향
  */

  let investmentText = "";


  if (!stable && analytical) {

    investmentText =
      "도전적·분석형 투자 성향입니다. 높은 수익 가능성에 관심이 있지만 정보를 확인하고 판단하려는 성향도 강합니다. 투자에서는 수익 가능성뿐 아니라 분산투자, 손실 가능성, 장기적인 관점도 함께 공부하는 것이 중요합니다.";

  }

  else if (!stable && !analytical) {

    investmentText =
      "도전적·직관형 투자 성향입니다. 새로운 투자 기회나 높은 수익 가능성에 관심을 가지기 쉽습니다. 다만 유행이나 주변 사람의 의견만으로 결정하지 않고 위험성과 정보를 충분히 확인하는 습관이 중요합니다.";

  }

  else if (stable && analytical) {

    investmentText =
      "안정적·분석형 투자 성향입니다. 높은 수익보다 위험을 관리하고 충분한 정보를 확인한 뒤 결정하는 것을 선호합니다. 예금, 적금, 채권, ETF, 분산투자 등의 기본 원리를 공부해보는 것이 좋습니다.";

  }

  else {

    investmentText =
      "안정적·직관형 투자 성향입니다. 큰 위험을 피하면서 자신이 이해하기 쉬운 경제적 선택을 선호합니다. 다양한 금융상품의 특징과 위험·수익의 관계를 조금씩 공부하면 선택의 폭을 넓힐 수 있습니다.";

  }


  document
    .getElementById("investment")
    .innerText =
    investmentText;



  createGraphs(scores);


  window.scrollTo(
    {
      top: 0,
      behavior: "smooth"
    }
  );

}



function createGraphs(scores) {

  const area =
    document.getElementById(
      "traitGraphs"
    );


  area.innerHTML = "";


  /*
  문항 수가 각 축마다 다르기 때문에
  해당 축의 최대 점수를 자동 계산
  */

  const graphs = [

    {
      axis: "ID",
      left: "즉흥 소비",
      right: "계획 소비"
    },

    {
      axis: "SC",
      left: "소비 중심",
      right: "저축 중심"
    },

    {
      axis: "AT",
      left: "도전형",
      right: "안정형"
    },

    {
      axis: "PF",
      left: "직관형",
      right: "분석형"
    }

  ];


  graphs.forEach(graph => {

    const questionCount =
      questions.filter(
        q => q.axis === graph.axis
      ).length;


    const maximumScore =
      questionCount * 2;


    const score =
      scores[graph.axis];


    /*
    -최대점수 = 0%
    +최대점수 = 100%
    */

    let percent =
      Math.round(
        (
          (score + maximumScore)
          /
          (maximumScore * 2)
        )
        * 100
      );


    percent =
      Math.max(
        0,
        Math.min(100, percent)
      );


    let dominantText;


    if (percent >= 50) {

      dominantText =
        `${graph.right} ${percent}%`;

    } else {

      dominantText =
        `${graph.left} ${100 - percent}%`;

    }


    const div =
      document.createElement("div");


    div.className =
      "trait";


    div.innerHTML = `

      <div class="trait-head">

        <span>
          ${graph.left}
        </span>

        <span>
          ${graph.right}
        </span>

      </div>


      <div class="trait-bar">

        <div
          class="trait-fill"
          style="width:${percent}%"
        ></div>

      </div>


      <div class="trait-result">

        ${dominantText}

      </div>

    `;


    area.appendChild(div);

  });

}



function restartTest() {

  currentQuestion = 0;


  userAnswers =
    new Array(
      questions.length
    ).fill(null);


  document
    .getElementById("resultScreen")
    .classList
    .add("hidden");


  document
    .getElementById("startScreen")
    .classList
    .remove("hidden");


  window.scrollTo(
    {
      top: 0,
      behavior: "smooth"
    }
  );

}
