<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MONEYTI - 고등학생 경제 성향 테스트</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f4f7fb;
      color: #172033;
    }

    .container {
      width: min(92%, 720px);
      margin: auto;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 0;
    }

    .card {
      width: 100%;
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      color: #173d77;
      font-size: 40px;
    }

    h2 {
      font-size: 25px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    h3 {
      margin-top: 32px;
      color: #173d77;
    }

    p {
      line-height: 1.7;
    }

    .subtitle {
      color: #69758a;
      font-size: 17px;
    }

    .start-icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .intro-box {
      background: #f6f8fc;
      padding: 18px;
      border-radius: 15px;
      margin: 25px 0;
      font-size: 14px;
      line-height: 1.7;
    }

    button {
      width: 100%;
      border: none;
      padding: 17px 20px;
      margin-top: 12px;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .main-button {
      background: #173d77;
      color: white;
      font-weight: 700;
    }

    .main-button:hover {
      background: #102f60;
      transform: translateY(-2px);
    }

    .answer-button {
      background: #f2f5f9;
      color: #243044;
      text-align: left;
      border: 2px solid transparent;
    }

    .answer-button:hover {
      background: #e4ebf5;
    }

    .answer-button.selected {
      background: #e4edfb;
      border-color: #3478d4;
      color: #173d77;
      font-weight: 700;
    }

    .back-button {
      background: white;
      color: #66758b;
      border: 1px solid #dbe2ec;
      margin-top: 22px;
    }

    .back-button:hover {
      background: #f5f7fa;
    }

    .progress-area {
      margin-bottom: 30px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
    }

    .progress-text {
      font-size: 14px;
      color: #788396;
    }

    .progress-percent {
      font-size: 14px;
      color: #3478d4;
      font-weight: 700;
    }

    .progress-bar {
      width: 100%;
      height: 9px;
      background: #e8edf5;
      border-radius: 30px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      background: #3478d4;
      transition: width .25s;
    }

    .category {
      display: inline-block;
      padding: 7px 12px;
      margin-bottom: 12px;
      border-radius: 20px;
      background: #edf3fc;
      color: #3478d4;
      font-size: 13px;
      font-weight: 700;
    }

    .result-type {
      text-align: center;
      color: white;
      background:
        linear-gradient(
          135deg,
          #173d77,
          #3b7cd4
        );
      padding: 30px 20px;
      border-radius: 22px;
      margin-bottom: 25px;
    }

    .result-label {
      opacity: .85;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .result-code {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .result-name {
      font-size: 23px;
      font-weight: 700;
      margin-top: 7px;
    }

    .trait {
      margin: 23px 0;
    }

    .trait-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .trait-bar {
      width: 100%;
      height: 12px;
      background: #e6ebf2;
      border-radius: 20px;
      overflow: hidden;
    }

    .trait-fill {
      height: 100%;
      background: #3478d4;
      border-radius: 20px;
    }

    .trait-result {
      margin-top: 6px;
      text-align: right;
      font-size: 13px;
      color: #6e7888;
    }

    .info-box {
      background: #f7f9fc;
      border-radius: 16px;
      padding: 20px;
      margin-top: 14px;
      line-height: 1.75;
    }

    .info-box strong {
      display: block;
      margin-bottom: 8px;
      color: #173d77;
      font-size: 17px;
    }

    .investment-card {
      background: #f7f9fc;
      border-radius: 16px;
      padding: 20px;
      margin-top: 14px;
      line-height: 1.75;
    }

    .investment-card h4 {
      margin: 0 0 12px 0;
      color: #173d77;
      font-size: 18px;
    }

    .asset-box {
      margin-top: 14px;
      padding: 14px;
      background: white;
      border-radius: 12px;
      border: 1px solid #e5eaf1;
    }

    .asset-box b {
      color: #173d77;
    }

    .asset-tag {
      display: inline-block;
      background: #eaf2ff;
      color: #245fa8;
      padding: 5px 9px;
      border-radius: 20px;
      margin: 3px;
      font-size: 13px;
      font-weight: 700;
    }

    .notice {
      background: #fff9e8;
      color: #66582f;
      padding: 16px;
      border-radius: 13px;
      margin-top: 25px;
      font-size: 13px;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }

    @media(max-width: 600px) {
      .card {
        padding: 28px 20px;
      }

      h1 {
        font-size: 32px;
      }

      h2 {
        font-size: 21px;
      }

      .result-code {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- 시작 화면 -->
  <div class="card" id="startScreen">

    <div class="start-icon">💰</div>

    <h1>MONEYTI</h1>

    <p class="subtitle">
      18개의 질문으로 알아보는<br>
      고등학생 경제 성향 테스트
    </p>

    <div class="intro-box">
      소비, 저축, 위험 감수, 경제적 판단 방식을 분석해
      나의 경제 성향과 어울리는 투자 방식을 알아봅니다.
    </div>

    <button class="main-button" onclick="startTest()">
      테스트 시작하기
    </button>

  </div>


  <!-- 질문 화면 -->
  <div class="card hidden" id="questionScreen">

    <div class="progress-area">

      <div class="progress-top">
        <span class="progress-text" id="progressText"></span>
        <span class="progress-percent" id="progressPercent"></span>
      </div>

      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>

    </div>

    <div class="category" id="category"></div>

    <h2 id="question"></h2>

    <div id="answers"></div>

    <button
      class="back-button"
      id="backButton"
      onclick="previousQuestion()"
    >
      ← 이전 질문
    </button>

  </div>


  <!-- 결과 화면 -->
  <div class="card hidden" id="resultScreen">

    <div class="result-type">

      <div class="result-label">
        나의 경제 유형
      </div>

      <div class="result-code" id="resultCode"></div>

      <div class="result-name" id="resultName"></div>

    </div>

    <p id="resultSummary"></p>

    <h3>📊 나의 경제 성향</h3>

    <div id="traitGraphs"></div>


    <div class="info-box">
      <strong>💎 장점</strong>
      <span id="strength"></span>
    </div>


    <div class="info-box">
      <strong>⚠️ 단점 및 주의할 점</strong>
      <span id="weakness"></span>
    </div>


    <div class="info-box">
      <strong>🔧 보완점</strong>
      <span id="improvement"></span>
    </div>


    <div class="info-box">
      <strong>💰 추천 경제 습관</strong>
      <span id="habit"></span>
    </div>


    <h3>📈 나에게 맞는 투자 방식</h3>

    <div
      class="investment-card"
      id="investmentDetail"
    ></div>


    <div class="notice">
      이 결과는 금융교육을 위한 성향 분석입니다.
      실제 투자에서는 자신의 자금 상황, 투자 기간,
      손실 가능성을 별도로 고려해야 합니다.
      특정 종목이나 금융상품을 추천하는 목적은 아닙니다.
    </div>


    <button
      class="main-button"
      onclick="restartTest()"
    >
      다시 테스트하기
    </button>

  </div>

</div>



<script>

const questions = [

  {

    ]
  },

  {

    answers: [

    ]

    answers: [
      ["가능하면 바로 살 방법을 찾는다.", -2],

  },

    answers: [

    ]
  },

  {
    category: "저축 습관",

    answers: [

      ["현재의 즐거움이 조금 더 중요하다.", -1],
      ["미래를 위한 준비가 조금 더 중요하다.", 1],

  },

    text: "작은 돈이 꾸준히 남는다면 어떻게 하는 편인가요?",
    axis: "SC",
    answers: [
      ["그때그때 사용한다.", -2],
      ["쓸 일이 생길 때 사용한다.", -1],
      ["모아두려고 한다.", 1],

    ]
  },

  {
    category: "투자 성향",

  },

  {

    text: "투자한 돈의 가치가 갑자기 크게 떨어졌다면 어떻게 할 것 같나요?",
    axis: "AT",
    answers: [
      ["다시 크게 오를 수도 있으니 계속 유지한다.", -2],

      ["추가 손실 가능성을 먼저 생각한다.", 1],
      ["처음부터 이렇게 변동이 큰 투자는 피하고 싶다.", 2]
    ]
  },

  {
    category: "투자 성향",
    text: "경제적으로 선택할 때 더 중요하게 생각하는 것은?",
    axis: "AT",
    answers: [
      ["큰 성공 가능성", -2],
      ["높은 성장 가능성", -1],
      ["안정적인 결과", 1],
      ["돈을 잃지 않는 것", 2]
    ]
  },

  {
    category: "투자 성향",
    text: "주변에서 최근 크게 오른 투자 상품이 화제가 된다면?",
    axis: "AT",
    answers: [

    axis: "PF",
    answers: [
      ["주변 사람들이 좋다고 하면 관심을 갖는다.", -2],

      ["기본적인 정보를 찾아본다.", 1],
      ["수익뿐 아니라 위험, 구조, 수수료까지 알아본다.", 2]

  },

  {
    category: "경제 판단",
    text: "큰 돈을 사용하거나 중요한 경제적 결정을 해야 할 때 나는?",
    axis: "PF",
    answers: [
      ["내 느낌을 믿고 빠르게 결정한다.", -2],
      ["주변 사람의 의견을 참고해 결정한다.", -1],
      ["여러 정보를 찾아보고 결정한다.", 1],
      ["여러 선택지를 비교하고 장단점을 분석한 뒤 결정한다.", 2]

];


let currentQuestion = 0;

let userAnswers =
  new Array(questions.length).fill(null);


function startTest() {

  document
    .getElementById("startScreen")
    .classList.add("hidden");

  document
    .getElementById("questionScreen")
    .classList.remove("hidden");

  showQuestion();

}


function showQuestion() {

  const q =
    questions[currentQuestion];

  const progress =
    Math.round(
      ((currentQuestion + 1) /
      questions.length) * 100
    );

  document
    .getElementById("progressText")
    .innerText =
    `${currentQuestion + 1} / ${questions.length}`;

  document
    .getElementById("progressPercent")
    .innerText =
    `${progress}%`;

  document
    .getElementById("progress")
    .style.width =
    `${progress}%`;

  document
    .getElementById("category")
    .innerText =
    q.category;

  document
    .getElementById("question")
    .innerText =
    q.text;

  const answersDiv =
    document.getElementById("answers");

  answersDiv.innerHTML = "";

  q.answers.forEach((answer, index) => {

    const button =
      document.createElement("button");

    button.className =
      "answer-button";

    if (
      userAnswers[currentQuestion]
      === index
    ) {
      button.classList.add("selected");
    }

    button.innerText =
      answer[0];

    button.onclick =
      () => selectAnswer(index);

    answersDiv.appendChild(button);

  });


  const backButton =
    document.getElementById("backButton");

  backButton.style.display =
    currentQuestion === 0
      ? "none"
      : "block";

}


function selectAnswer(answerIndex) {

  userAnswers[currentQuestion] =
    answerIndex;

  if (
    currentQuestion
    < questions.length - 1
  ) {

    currentQuestion++;

    showQuestion();

  } else {

    showResult();

  }

}


function previousQuestion() {

  if (currentQuestion > 0) {

    currentQuestion--;

    showQuestion();

  }

}


function calculateScores() {

  const scores = {
    ID: 0,
    SC: 0,
    AT: 0,
    PF: 0
  };


  questions.forEach(
    (question, index) => {

      const selected =
        userAnswers[index];

      if (selected !== null) {

        scores[question.axis] +=
          question.answers[selected][1];

      }

    }
  );

  return scores;

}


function makeType(scores) {

  let type = "";

  type += scores.ID >= 0 ? "D" : "I";
  type += scores.SC >= 0 ? "S" : "C";
  type += scores.AT >= 0 ? "T" : "A";
  type += scores.PF >= 0 ? "P" : "F";

  return type;

}

        “무조건 안전한 상품”이 아니라
        <b>주식보다 변동성을 줄이는 데 활용할 수 있는 자산</b>으로
        이해하는 것이 좋습니다.
      </div>

      <div class="asset-box">
        <b>📈 주식</b><br><br>

        주식을 완전히 피할 필요는 없습니다.

        중요한 것은

    `;

  }


  /*
  4. 공격 + 직관
  */

  else {

    box.innerHTML = `

      <h4>⚡ 적극적·직관형 투자 방식</h4>

        이런 성향 자체가 나쁜 것은 아니지만
        <b>투자 판단의 속도보다 판단 과정의 질을 높이는 것</b>이 중요합니다.
      </p>

      <div class="asset-box">
        <b>📈 주식</b><br><br>

        주식은 당신에게 흥미로운 투자 방식일 수 있습니다.

        다만 최근 많이 오른 주식을
        “앞으로도 계속 오를 주식”이라고 생각하는 것은 위험할 수 있습니다.

        시장에서는 좋은 뉴스가 이미 가격에 반영되어 있을 수 있기 때문입니다.

        주식을 볼 때는
        “얼마나 올랐는가?”보다
        <b>이 기업은 어떻게 돈을 벌고,

      </div>

      <div class="asset-box">
        <b>🏦 예금의 역할</b><br><br>

        공격적인 투자 성향일수록
        일부 돈을 투자하지 않고 남겨두는 것이 중요할 수 있습니다.

        예금이나 현금성 자산이 있으면
        시장이 크게 떨어졌을 때 모든 돈이 손실 상태가 되는 것을 막고,
        필요할 때 사용할 돈을 투자 자산에서 빼지 않아도 됩니다.

        즉 예금은
        단순히 수익률이 낮은 상품이 아니라
        <b>투자 결정을 조급하게 만들지 않는 안전장치</b>가 될 수 있습니다.
      </div>

      <div class="asset-box">

        자산 전체의 변동성을 조절하는 데 활용될 수 있습니다.

        투자에서 중요한 것은
        가장 높은 수익을 내는 자산만 고르는 것이 아니라
        서로 다른 성격의 자산을 섞어
        큰 손실 가능성을 줄이는 것입니다.
      </div>

      <p>
        <b>추천 학습 주제:</b>
        FOMO,
        기업가치,
        분산투자,
        포트폴리오,
        위험 대비 수익률
      </p>

    `;

  }

}



function createGraphs(scores) {

  const area =
    document.getElementById(
      "traitGraphs"
    );

  area.innerHTML = "";


  const graphs = [

    {
      axis: "ID",
      left: "즉흥 소비",
      right: "계획 소비"
    },

    {
      axis: "SC",
      left: "소비 중심",
      right: "저축 중심"
    },

    {
      axis: "AT",
      left: "도전형",
      right: "안정형"
    },

    {
      axis: "PF",
      left: "직관형",
      right: "분석형"
    }

  ];


  graphs.forEach(graph => {

    const questionCount =
      questions.filter(
        q => q.axis === graph.axis
      ).length;

    const maximumScore =
      questionCount * 2;

    const score =
      scores[graph.axis];

    let percent =
      Math.round(
        (
          (score + maximumScore)
          /
          (maximumScore * 2)
        )
        * 100
      );

    percent =
      Math.max(
        0,
        Math.min(100, percent)
      );


    let dominantText;

    if (percent >= 50) {

      dominantText =
        `${graph.right} ${percent}%`;

    } else {

      dominantText =
        `${graph.left} ${100 - percent}%`;

    }


    const div =
      document.createElement("div");

    div.className = "trait";

    div.innerHTML = `

      <div class="trait-head">

        <span>${graph.left}</span>

        <span>${graph.right}</span>

      </div>

      <div class="trait-bar">

        <div
          class="trait-fill"
          style="width:${percent}%"
        ></div>

      </div>

      <div class="trait-result">

        ${dominantText}

      </div>

    `;

    area.appendChild(div);

  });

}



function restartTest() {

  currentQuestion = 0;

  userAnswers =
    new Array(
      questions.length
    ).fill(null);

  document
    .getElementById("resultScreen")
    .classList.add("hidden");

  document
    .getElementById("startScreen")
    .classList.remove("hidden");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}
